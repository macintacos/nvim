[settings]
lockfile = true

# HK_MISE routes hk's git-hook subprocesses through `mise x`, so each hook step
# uses the pinned versions below even when committing without mise activated.
[env]
HK_MISE = 1

[tools]
# Lua toolchain (existing) — formatter + linter for the config itself.
"aqua:JohnnyMorganz/StyLua" = "latest"
"aqua:Kampfkarren/selene"   = "latest"

# hk evaluates hk.pkl through pkl, so both are required. pkl also powers the
# Pkl(Format) / Pkl(Lint) steps that lint hk.pkl itself.
hk  = "latest"
pkl = "latest"

# Cross-language baseline (Markdown / YAML / TOML / Shell).
rumdl                 = "latest" # Markdown format + lint (config in .rumdl.toml)
"aqua:google/yamlfmt" = "latest" # YAML format
taplo                 = "latest" # TOML format + lint (config in taplo.toml)
shfmt                 = "latest" # Shell format (.mise/tasks scripts)
shellcheck            = "latest" # Shell lint

# (Re)register git hooks whenever tools are installed or updated.
[hooks]
postinstall = "hk install --mise"
